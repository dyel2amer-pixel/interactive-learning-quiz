<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأسئلة التعليمية التفاعلية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid #ffd700;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-text {
            text-align: center;
            color: #fff;
            margin-top: 10px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .content {
            padding: 40px;
            min-height: 500px;
        }

        .quiz-card {
            display: none;
            animation: slideIn 0.5s ease;
        }

        .quiz-card.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question {
            font-size: 1.6em;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea15, #764ba215);
            padding: 20px;
            border-radius: 10px;
            border-right: 5px solid #667eea;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .option {
            padding: 20px;
            border: 3px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            background: #f9f9f9;
            transition: all 0.3s ease;
            font-size: 1.1em;
            text-align: center;
            font-weight: bold;
            color: #333;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f0ff;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .option.selected {
            border-color: #667eea;
            background: #e8eaf6;
        }

        .option.correct {
            border-color: #4CAF50;
            background: #c8e6c9;
            color: #2e7d32;
            animation: correctAnswer 0.6s ease;
        }

        .option.wrong {
            border-color: #f44336;
            background: #ffcdd2;
            color: #c62828;
            animation: wrongAnswer 0.6s ease;
        }

        @keyframes correctAnswer {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes wrongAnswer {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .feedback {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.2em;
            text-align: center;
            font-weight: bold;
            animation: slideIn 0.5s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            color: white;
            border-left: 5px solid #2e7d32;
        }

        .feedback.wrong {
            background: linear-gradient(135deg, #f44336, #ff7043);
            color: white;
            border-left: 5px solid #c62828;
        }

        .celebration {
            font-size: 1.4em;
            margin: 10px 0;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-next {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            color: white;
            flex: 1;
        }

        .btn-next:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            flex: 1;
        }

        .btn-restart:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .results {
            text-align: center;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results-content {
            background: linear-gradient(135deg, #667eea15, #764ba215);
            padding: 40px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .score {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(#4CAF50 var(--score-percentage), #f0f0f0 0);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .results h2 {
            font-size: 2em;
            color: #333;
            margin: 20px 0;
        }

        .results p {
            font-size: 1.2em;
            color: #666;
            margin: 10px 0;
        }

        .star {
            display: inline-block;
            font-size: 2em;
            margin: 0 5px;
            animation: starPop 0.6s ease;
        }

        @keyframes starPop {
            0% { transform: scale(0) rotate(0deg); }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .question-number {
            background: #667eea;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3em;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        /* شاشة كاملة */
        @media (max-width: 768px) {
            .options {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .question {
                font-size: 1.2em;
            }

            .option {
                font-size: 1em;
                padding: 15px;
            }

            .content {
                padding: 20px;
            }
        }

        /* شاشة عريضة جداً */
        @media (min-width: 1920px) {
            .container {
                max-width: 1400px;
            }

            .header h1 {
                font-size: 3em;
            }

            .question {
                font-size: 2em;
            }

            .option {
                font-size: 1.4em;
                padding: 30px;
            }

            .btn {
                font-size: 1.3em;
                padding: 20px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 لوحة الأسئلة التعليمية التفاعلية</h1>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-text">السؤال <span id="current-question">1</span> من <span id="total-questions">20</span></div>
        </div>

        <div class="content">
            <div id="quiz-container"></div>
            
            <div class="results" id="results">
                <div class="results-content">
                    <h2>🎉 تم إنهاء الاختبار 🎉</h2>
                    <div class="score-circle" id="score-circle">0%</div>
                    <div class="score" id="score-display">0/20</div>
                    <p id="result-message"></p>
                    <p id="result-detail"></p>
                </div>
            </div>

            <div class="buttons" id="buttons-container">
                <button class="btn btn-next" id="next-btn" disabled>السؤال التالي ➜</button>
            </div>
        </div>
    </div>

    <script src="quiz-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
